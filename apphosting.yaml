runConfig:
  concurrency: 100
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

# ignoreBuildErrors 撤去後、本番ビルドの TypeScript チェックで OOM が起きるため
# builder のメモリを 4GB に増やす (デフォルトの 2GB だと next build が SIGABRT)
buildConfig:
  memoryMiB: 4096

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
  # Web Push 用の VAPID 公開鍵。Firebase Console のウェブプッシュ証明書で
  # 発行する。未設定だと通知トークンを取得できず、プッシュ通知が一切届かない。
  - variable: NEXT_PUBLIC_FIREBASE_VAPID_KEY
    secret: NEXT_PUBLIC_FIREBASE_VAPID_KEY
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  # Gemini Live 音声面接プロバイダ用（Secret Manager: GEMINI_API_KEY、backend coach-app に権限付与済み）
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL
  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY
  - variable: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
    secret: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
  - variable: AZURE_DOCUMENT_INTELLIGENCE_KEY
    secret: AZURE_DOCUMENT_INTELLIGENCE_KEY
  - variable: GOOGLE_CLOUD_PROJECT_ID
    secret: GOOGLE_CLOUD_PROJECT_ID
  - variable: BIGQUERY_DATASET
    secret: BIGQUERY_DATASET
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
  - variable: STRIPE_PRO_PRICE_ID
    secret: STRIPE_PRO_PRICE_ID
  # LiveKit Cloud（アプリ内ビデオ通話）。
  #
  # 【有効化の手順】この4行のコメントを外す前に、必ず先に済ませること。
  #   1. LiveKit Cloud でプロジェクトを作り、API Key / Secret / URL を得る
  #   2. Secret Manager に LIVEKIT_API_KEY と LIVEKIT_API_SECRET を作る
  #   3. backend coach-app に secretAccessor を付ける
  # 存在しない secret を参照すると **App Hosting のデプロイ自体が失敗する**ため、
  # 鍵が用意できるまではコメントのままにしておく。
  # 未設定でも通話ボタンが出ないだけで、既存機能とビルドには影響しない。
  #
  # - variable: LIVEKIT_API_KEY
  #   secret: LIVEKIT_API_KEY
  # - variable: LIVEKIT_API_SECRET
  #   secret: LIVEKIT_API_SECRET
  # wss://xxx.livekit.cloud。クライアントが接続先として必要とし、秘匿性は無い。
  # - variable: NEXT_PUBLIC_LIVEKIT_URL
  #   value: wss://xxxxx.livekit.cloud
  #
  # 録画を使うときだけ "1" にする。未設定なら録画ボタンが出ず、API も 503 を返す。
  # 費用の大半は録画（映像1分あたり約3円、無料枠は月60分）。
  # - variable: NEXT_PUBLIC_CALL_RECORDING
  #   value: "1"
  # Google Programmable Search Engine の検索エンジン ID (cx)。
  # クライアントに露出する非機密値のため Secret ではなく平文 value で設定。
  - variable: NEXT_PUBLIC_GOOGLE_PSE_CX
    value: b3859904ace8b4d96
